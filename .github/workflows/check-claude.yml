name: Check Claude token

# Run this from the Actions tab whenever the daily update reports a Claude error.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Inspect token shape (the value itself is never printed)
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "length: ${#T}"
          if [[ "$T" =~ ^sk-ant-oat[0-9]+- ]]; then echo "prefix: looks like a setup-token"; else echo "prefix: NOT a setup-token"; fi
          if [[ "$T" =~ [[:space:]] ]]; then echo "contains whitespace: yes"; else echo "contains whitespace: no"; fi

      - name: Send a tiny test request
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "Reply with the single word ok" | claude -p --model sonnet --tools "" --strict-mcp-config --no-session-persistence
